<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--MU:HEAD-->
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="mu-tokens">@@TOKENS@@</style>
<style>
/* ── preview chrome: "studio inspector" + the theatre's Export panel and full stage — every colour is a token (mu-tokens) ── */
.mupv-app { --side-w: clamp(336px, 26.5vw, 384px); --ease: cubic-bezier(.22, .8, .24, 1); --dur: 300ms;
  position: fixed; inset: 0; box-sizing: border-box; display: grid; overflow: hidden; overflow: clip;
  grid-template-columns: minmax(0, 1fr) var(--side-w); grid-template-rows: auto minmax(0, 1fr);
  background: var(--mu-bg); color: var(--mu-txt); font: 13px/1.45 Inter, 'Helvetica Neue', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
.mupv-app *, .mupv-app *::before, .mupv-app *::after { box-sizing: border-box; }
.mupv-app button, .mupv-app select { font: inherit; color: inherit; }
.mupv-app :focus-visible { outline: 2px solid var(--mu-acc); outline-offset: 2px; }
.mupv-app svg { display: block; flex: none; }
.mupv-app.is-instant, .mupv-app.is-instant * { transition: none !important; }
.mupv-num { font-variant-numeric: tabular-nums; }

/* app bar */
.mupv-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 18px; min-height: 48px; padding: 8px 16px 8px 20px; border-bottom: 1px solid var(--mu-line); min-width: 0; }   /* right: 16 px = the inspector's text edge, so Export ends with the text below */
.mupv-top h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mupv-badge { display: flex; align-items: center; color: var(--mu-sub); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; overflow: hidden; }
.mupv-badge span + span::before { content: ''; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--mu-line); margin: 0 9px; vertical-align: middle; }
.mupv-mode { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border: 1px solid var(--mu-line); border-radius: 13px; font-size: 12px; color: var(--mu-sub); white-space: nowrap; }
.mupv-mode i { width: 6px; height: 6px; border-radius: 50%; background: var(--mu-sub); }
.mupv-mode.is-live { color: var(--mu-txt); }
.mupv-mode.is-live i { background: var(--mu-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mu-good) 22%, transparent); }
.mupv-mode.is-disk { color: var(--mu-txt); }
.mupv-agentline { flex: none; font-size: 12.5px; color: var(--mu-sub); white-space: nowrap; }
@media (max-width: 760px) { .mupv-agentline { display: none; } }
.mupv-mode.is-disk i { background: var(--mu-warn); }
/* a board card opened from the disk: rendering and exporting happen in the app */
.mupv-disk { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--mu-warn) 45%, var(--mu-line)); border-radius: 10px; background: color-mix(in srgb, var(--mu-warn) 8%, transparent); font-size: 12.5px; line-height: 1.5; }
.mupv-disk b { font-weight: 600; font-size: 13px; }
.mupv-disk span { color: var(--mu-sub); }
.mupv-app .mupv-disk a { align-self: flex-start; margin-top: 4px; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--mu-acc); color: var(--mu-on-acc); font-weight: 600; text-decoration: none; }
.mupv-app .mupv-xbtn, .mupv-app .mupv-show { position: relative; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 10px; margin: -2px 0;
  border: 0; border-radius: 8px; background: transparent; color: var(--mu-txt); font-weight: 500; white-space: nowrap; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--mu-line); transition: background-color .15s, box-shadow .15s; }
.mupv-app .mupv-xbtn svg, .mupv-app .mupv-show svg { width: 15px; height: 15px; }
.mupv-app .mupv-show:hover { background: var(--mu-soft); }
/* Export: the page's primary action — a filled accent button with dark text; open = an outer ring */
.mupv-app .mupv-xbtn { background: var(--mu-acc); color: var(--mu-on-acc); font-weight: 600; box-shadow: none; transition: filter .15s, box-shadow .15s; }
.mupv-app .mupv-xbtn svg { color: var(--mu-on-acc); }
.mupv-app .mupv-xbtn:hover { background: var(--mu-acc); filter: brightness(1.07); }
.mupv-app .mupv-xbtn[aria-expanded="true"] { background: var(--mu-acc); box-shadow: 0 0 0 2px var(--mu-bg), 0 0 0 3px var(--mu-acc); }
.mupv-xbtn .mupv-dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.mupv-xbtn .mupv-dot.is-busy { background: var(--mu-on-acc); animation: mupv-pulse 1.1s ease-in-out infinite; }
.mupv-xbtn .mupv-dot.is-good { background: var(--mu-on-acc); }
.mupv-xbtn .mupv-dot.is-bad { background: var(--mu-bad); box-shadow: 0 0 0 1.5px var(--mu-on-acc); }
@keyframes mupv-pulse { 50% { opacity: .3; } }
.mupv-app .mupv-show { display: none; padding-right: 7px; color: var(--mu-sub); }
.mupv-app .mupv-show:hover { color: var(--mu-txt); }
.mupv-app.is-stage .mupv-show { display: inline-flex; animation: mupv-in var(--dur) var(--ease) both; }
@keyframes mupv-in { from { opacity: 0; transform: translateX(10px); } }

/* player column */
.mupv-main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mupv-view { position: relative; flex: 1; min-height: 180px; margin: 18px 20px 0; }
.mupv-frame { position: absolute; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px var(--mu-line), 0 18px 48px -20px var(--mu-scrim); }
.mupv-frame.is-clear, .mupv-clear { background-color: #fff; background-image: linear-gradient(45deg, #d9d7d2 25%, transparent 25%), linear-gradient(-45deg, #d9d7d2 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d9d7d2 75%), linear-gradient(-45deg, transparent 75%, #d9d7d2 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
.mupv-clear { background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0; }

/* transport */
.mupv-transport { container-type: inline-size; position: relative; z-index: 2; background: var(--mu-bg); display: flex; align-items: center; gap: 8px 14px; padding: 14px 20px 12px; flex-wrap: wrap; }
.mupv-tgroup { display: flex; align-items: center; gap: 4px; }
.mupv-app .mupv-play { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; min-width: 88px; padding: 0 14px 0 12px; border: 0; border-radius: 7px;
  background: var(--mu-acc); color: var(--mu-on-acc); font-weight: 600; cursor: pointer; margin-right: 4px; }
.mupv-app .mupv-play svg { width: 14px; height: 14px; }
.mupv-app .mupv-play:hover { filter: brightness(1.06); }
.mupv-icon { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--mu-sub); cursor: pointer; white-space: nowrap; font-size: 12.5px; }
.mupv-icon svg { width: 15px; height: 15px; }
.mupv-icon:hover { color: var(--mu-txt); background: var(--mu-soft); }
.mupv-icon[hidden] { display: none; }
.mupv-icon[aria-pressed] { border-color: var(--mu-line); }
.mupv-icon[aria-pressed="true"] { color: var(--mu-txt); background: var(--mu-soft); border-color: var(--mu-soft); }
.mupv-icon[aria-pressed="false"] span { text-decoration: line-through; text-decoration-color: var(--mu-sub); }
.mupv-time { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mupv-time b { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; min-width: 62px; }
.mupv-time span { color: var(--mu-sub); }
.mupv-time em { font-style: normal; color: var(--mu-sub); font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--mu-line); border-radius: 5px; }
.mupv-now { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--mu-sub); font-size: 12.5px; white-space: nowrap; }
.mupv-now b { color: var(--mu-txt); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.mupv-now i { font-style: normal; font-variant-numeric: tabular-nums; }
.mupv-speed { display: flex; height: 32px; padding: 2px; gap: 2px; border: 1px solid var(--mu-line); border-radius: 8px; background: var(--mu-field); }
.mupv-speed button { border: 0; background: transparent; border-radius: 6px; padding: 0 8px; min-width: 36px; color: var(--mu-sub); cursor: pointer; font-size: 12px; font-variant-numeric: tabular-nums; }
.mupv-speed button:hover { color: var(--mu-txt); }
.mupv-speed button[aria-pressed="true"] { background: var(--mu-soft); color: var(--mu-txt); font-weight: 500; }

/* timeline: ruler · filmstrip · voice-over lane, one playhead through all three */
.mupv-tlwrap { padding: 0 20px 14px; transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), visibility 0s; }
/* full stage: a hairline scrubber on the transport's top edge */
.mupv-mini { position: absolute; left: 20px; right: 20px; top: 1px; height: 14px; cursor: pointer; touch-action: none; opacity: 0; visibility: hidden;
  transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur); }
.mupv-mini::before, .mupv-mini i { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 2px; transition: top .12s, height .12s; }
.mupv-mini::before { background: var(--mu-line); }
.mupv-mini i { background: var(--mu-acc); transform-origin: 0 50%; transform: scaleX(0); }
.mupv-mini:hover::before, .mupv-mini:hover i, .mupv-mini.is-drag::before, .mupv-mini.is-drag i { top: 5px; height: 4px; }
.mupv-bar { position: relative; height: 108px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; outline-offset: 4px; }
.mupv-ruler { position: absolute; left: 0; right: 0; top: 0; height: 18px; border-bottom: 1px solid var(--mu-line); }
.mupv-tick { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--mu-line); }
.mupv-tick.is-major { height: 8px; background: var(--mu-sub); opacity: .55; }
.mupv-tick span { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; line-height: 1; color: var(--mu-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mupv-strip { position: absolute; left: 0; right: 0; top: 24px; height: 70px; }
.mupv-seg { position: absolute; top: 0; height: 70px; min-width: 0; container-type: inline-size; }
.mupv-seg-th { position: relative; height: 48px; border-radius: 4px; overflow: hidden; background: var(--mu-soft); }
.mupv-seg-th > .gl-stage { opacity: .74; transition: opacity .18s; }
.mupv-seg:hover .mupv-seg-th > .gl-stage { opacity: .9; }
.mupv-seg.is-on .mupv-seg-th > .gl-stage { opacity: 1; }
.mupv-seg-th::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--mu-line); pointer-events: none; }
.mupv-seg.is-on .mupv-seg-th::after { box-shadow: inset 0 0 0 2px var(--mu-acc); }
.mupv-seg-cap { display: flex; gap: 6px; align-items: baseline; margin-top: 5px; padding: 0 6px 0 1px; font-size: 11.5px; line-height: 16px; color: var(--mu-sub); white-space: nowrap; overflow: hidden; }
.mupv-seg-cap b { font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.mupv-seg-cap span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mupv-seg-th em { position: absolute; right: 4px; bottom: 4px; z-index: 1; font-style: normal; font-size: 10.5px; line-height: 15px; padding: 0 5px; border-radius: 4px; background: var(--mu-chip); color: var(--mu-chip-txt); font-variant-numeric: tabular-nums; pointer-events: none; }
@container (max-width: 86px) { .mupv-seg-th em { display: none; } }
.mupv-seg.is-on .mupv-seg-cap { color: var(--mu-txt); }
.mupv-lane { position: absolute; left: 0; right: 0; top: 98px; height: 10px; }
.mupv-vo { position: absolute; top: 2px; height: 6px; border-radius: 3px; background: var(--mu-sub); opacity: .55; transition: opacity .15s; }
.mupv-vo.is-on { opacity: 1; background: var(--mu-txt); }
.mupv-vo.is-script { top: 4px; height: 2px; border-radius: 0; background: repeating-linear-gradient(90deg, var(--mu-sub) 0 2px, transparent 2px 5px); opacity: .7; }
.mupv-vo.is-script.is-on { opacity: 1; background: repeating-linear-gradient(90deg, var(--mu-txt) 0 2px, transparent 2px 5px); }
.mupv-sfx { position: absolute; top: 0; width: 1px; height: 10px; background: var(--mu-sub); opacity: .5; pointer-events: none; }
.mupv-head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--mu-acc); box-shadow: 0 0 0 1px var(--mu-bg); pointer-events: none; z-index: 3; }
.mupv-head::before { content: ''; position: absolute; left: -5px; top: -1px; width: 12px; height: 15px; background: var(--mu-acc); border-radius: 3px 3px 0 0; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.mupv-ghost { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--mu-txt); opacity: 0; pointer-events: none; z-index: 2; transition: opacity .1s; }
.mupv-ghost span { position: absolute; top: 0; left: 6px; padding: 1px 5px; border-radius: 4px; background: var(--mu-soft); color: var(--mu-txt); font-size: 10.5px; line-height: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mupv-bar.is-hover .mupv-ghost { opacity: .4; }
.mupv-bar.is-hover .mupv-ghost span { opacity: 1; }
.mupv-bar.is-drag .mupv-ghost { opacity: 0; }
.mupv-tlfoot { display: flex; align-items: center; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--mu-sub); }
.mupv-keys { display: flex; align-items: center; gap: 5px 12px; flex-wrap: wrap; }
.mupv-keys span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.mupv-app kbd { font: 500 10.5px/1 Inter, system-ui, sans-serif; min-width: 18px; padding: 3px 5px; text-align: center; border-radius: 4px; background: var(--mu-soft); color: var(--mu-txt); box-shadow: inset 0 -1px 0 var(--mu-line); }
.mupv-legend { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.mupv-legend i { width: 18px; height: 6px; border-radius: 3px; background: var(--mu-sub); opacity: .7; }
.mupv-legend i.is-script { height: 2px; border-radius: 0; background: repeating-linear-gradient(90deg, var(--mu-sub) 0 2px, transparent 2px 5px); }

/* inspector: two panes on a track — Scenes/Design tabs, and the Export panel that slides in over them */
.mupv-side { position: relative; z-index: 3; grid-column: 2; grid-row: 2; min-height: 0; min-width: 0; overflow: hidden; overflow: clip; background: var(--mu-panel); border-left: 1px solid var(--mu-line);
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), visibility 0s; }
.mupv-track { display: flex; width: 200%; height: 100%; transition: transform var(--dur) var(--ease); }
.mupv-track > * { flex: none; width: 50%; min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; transition: opacity var(--dur) var(--ease); }
.mupv-side.is-deliver .mupv-track { transform: translateX(-50%); }
.mupv-side.is-deliver .mupv-insp, .mupv-side:not(.is-deliver) .mupv-deliver { opacity: 0; }
.mupv-tabs { flex: none; display: flex; align-items: stretch; height: 44px; padding: 0 7px 0 8px; border-bottom: 1px solid var(--mu-line); }   /* right: 16 px (the text edge) minus the icon’s 9 px inset: the glyph ends with Export and the text */
.mupv-tablist { display: flex; gap: 2px; }
.mupv-tab { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border: 0; background: transparent; color: var(--mu-sub); font-weight: 500; cursor: pointer; }
.mupv-tab svg { width: 15px; height: 15px; }
.mupv-tab:hover { color: var(--mu-txt); }
.mupv-tab[aria-selected="true"] { color: var(--mu-txt); }
.mupv-tab[aria-selected="true"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--mu-txt); }
.mupv-tab small { font-size: 11px; color: var(--mu-sub); font-variant-numeric: tabular-nums; font-weight: 500; }
.mupv-tabs .mupv-hide { margin-left: auto; align-self: center; }
.mupv-panel { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--mu-line) transparent; }
.mupv-panel[hidden] { display: none !important; }
/* anything the page hides stays hidden: a class's own display beats the browser's [hidden] */
.mupv-app [hidden] { display: none !important; }
.mupv-phead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; font-size: 12px; color: var(--mu-sub); }
.mupv-phead b { color: var(--mu-txt); font-weight: 500; }
.mupv-h { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--mu-sub); display: flex; align-items: baseline; gap: 8px; }
.mupv-h span { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500; font-variant-numeric: tabular-nums; }
.mupv-note { color: var(--mu-sub); font-size: 12px; margin: 0; }

/* Scenes */
.mupv-scenes { display: flex; flex-direction: column; padding: 0 8px 8px; }
.mupv-scene { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; padding: 9px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.mupv-scene + .mupv-scene::after { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--mu-line); }
.mupv-scene:hover { background: var(--mu-soft); }
.mupv-scene.is-on { background: var(--mu-soft); }
.mupv-scene:hover::after, .mupv-scene:hover + .mupv-scene::after, .mupv-scene.is-on::after, .mupv-scene.is-on + .mupv-scene::after { opacity: 0; }
.mupv-sth { position: relative; display: block; width: 96px; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: var(--mu-soft); }
.mupv-sth::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--mu-line); pointer-events: none; }
.mupv-scene.is-on .mupv-sth::after { box-shadow: inset 0 0 0 2px var(--mu-acc); }
.mupv-sprog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--mu-acc); z-index: 1; display: none; }
.mupv-scene.is-on .mupv-sprog { display: block; }
.mupv-sbody { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 1px; }
.mupv-shead { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.mupv-shead i { font-style: normal; color: var(--mu-sub); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; width: 12px; }
.mupv-shead b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mupv-shead span { margin-left: auto; flex: none; color: var(--mu-sub); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.mupv-scene.is-on .mupv-shead i { color: var(--mu-acc); }
.mupv-smeta { color: var(--mu-sub); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 20px; }
.mupv-sline { display: flex; gap: 6px; align-items: flex-start; padding-left: 20px; margin-top: 3px; font-size: 12px; line-height: 1.4; color: var(--mu-txt); opacity: .82; }
.mupv-sline svg { width: 12px; height: 12px; margin-top: 2px; color: var(--mu-sub); }
.mupv-sline span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mupv-vonote { margin: 4px 16px 18px; padding: 10px 12px; border: 1px dashed var(--mu-line); border-radius: 8px; }

/* Design */
.mupv-dsec { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.mupv-dsec + .mupv-dsec { border-top: 1px solid var(--mu-line); }
.mupv-keycols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.mupv-sw { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 6px; border-radius: 8px; border: 1px solid var(--mu-line); background: transparent; cursor: copy; text-align: left; min-width: 0; }
.mupv-sw:hover { border-color: var(--mu-sub); }
.mupv-sw i { grid-row: 1 / 3; width: 30px; height: 30px; border-radius: 5px; }
.mupv-sw b { font-weight: 500; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Export panel */

.mupv-dbody { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 0 18px 22px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--mu-line) transparent; }
.mupv-sec { padding: 16px 0 18px; display: flex; flex-direction: column; gap: 11px; }
.mupv-sec + .mupv-sec { border-top: 1px solid var(--mu-line); }
.mupv-fmts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mupv-fmts button { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; padding: 9px 9px 10px; border-radius: 9px; border: 1px solid var(--mu-line); background: transparent;
  text-align: left; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s; }
.mupv-fmts button b { font-weight: 600; font-size: 12.5px; color: var(--mu-txt); white-space: nowrap; }
.mupv-fmts button span { font-size: 11.5px; line-height: 1.3; color: var(--mu-sub); }
.mupv-fmts button:hover { border-color: var(--mu-sub); }
.mupv-fmts button[aria-pressed="true"] { border-color: var(--mu-acc); background: var(--mu-soft); box-shadow: inset 0 0 0 1px var(--mu-acc); }
.mupv-toggle { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 2px 0; cursor: pointer; }
.mupv-toggle b { font-weight: 500; }
.mupv-toggle small { grid-row: 2; color: var(--mu-sub); font-size: 12px; }
.mupv-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.mupv-toggle u { grid-column: 2; grid-row: 1 / 3; position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--mu-soft); box-shadow: inset 0 0 0 1px var(--mu-line); transition: background-color .2s; }
.mupv-toggle u::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mu-sub); transition: transform .2s var(--ease), background-color .2s; }
.mupv-toggle input:checked + u { background: var(--mu-acc); box-shadow: none; }
.mupv-toggle input:checked + u::after { transform: translateX(14px); background: var(--mu-on-acc); }
.mupv-toggle input:focus-visible + u { outline: 2px solid var(--mu-acc); outline-offset: 2px; }
.mupv-opts { display: flex; flex-direction: column; gap: 6px; }
.mupv-opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 11px; padding: 10px 12px; border: 1px solid var(--mu-line); border-radius: 9px; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s; }
.mupv-opt:hover { border-color: var(--mu-sub); }
.mupv-opt:has(input:checked) { border-color: var(--mu-acc); background: var(--mu-soft); box-shadow: inset 0 0 0 1px var(--mu-acc); }
.mupv-opt input { grid-row: 1 / 3; appearance: none; -webkit-appearance: none; display: grid; place-items: center; margin: 1px 0 0; width: 16px; height: 16px;
  border: 1.5px solid var(--mu-sub); border-radius: 50%; background: transparent; cursor: pointer; transition: border-color .12s; }
.mupv-opt input:checked { border-color: var(--mu-acc); }
.mupv-opt input:checked::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--mu-acc); }
.mupv-opt b { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mupv-opt b em { font-style: normal; font-size: 10.5px; font-weight: 600; line-height: 16px; padding: 0 6px; border-radius: 4px; background: var(--mu-acc); color: var(--mu-on-acc); }
.mupv-opt span { color: var(--mu-sub); font-size: 12px; line-height: 1.4; }
.mupv-aenote { margin: 0; padding: 9px 11px; border-radius: 8px; background: color-mix(in srgb, var(--mu-warn) 12%, transparent); color: var(--mu-txt); font-size: 12px; line-height: 1.45; }
.mupv-status code { font-size: 11.5px; overflow-wrap: anywhere; }
.mupe-tip { margin: 0; }
.mupv-app .mupv-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 42px; margin-top: 2px; border: 0; border-radius: 10px; padding: 0 14px;
  background: var(--mu-acc); color: var(--mu-on-acc); font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .15s var(--ease); }
.mupv-app .mupv-go svg { width: 15px; height: 15px; }

.mupv-app .mupv-go:active { transform: scale(.985); }
.mupv-app .mupv-go:disabled { opacity: .6; cursor: progress; filter: none; transform: none; }
.mupv-status { font-size: 12.5px; line-height: 1.5; color: var(--mu-sub); overflow-wrap: anywhere; }
.mupv-status .mupv-cmd { margin-top: 8px; }
.mupv-status:empty { display: none; }
.mupv-status.is-bad { color: var(--mu-bad); }
.mupv-status.is-good { color: var(--mu-good); }

.mupv-result:empty { display: none; }
.mupv-result video { display: block; width: 100%; max-width: 100%; border-radius: 8px; background: var(--mu-field); border: 1px solid var(--mu-line); }
.mupv-cmd { display: flex; gap: 6px; align-items: stretch; color: var(--mu-txt); }
.mupv-cmd code { flex: 1; min-width: 0; display: block; background: var(--mu-field); border: 1px solid var(--mu-line); border-radius: 7px; padding: 7px 9px; font: 12px/1.45 Inter, 'Helvetica Neue', system-ui, sans-serif; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.mupv-btn { border: 1px solid var(--mu-line); background: var(--mu-soft); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.mupv-btn:hover { border-color: var(--mu-sub); }

/* full stage: the inspector slides out right, the timeline drops away, the film grows (FLIP, transform only) */
.mupv-app.is-stage { grid-template-columns: minmax(0, 1fr); }
.mupv-app.is-stage .mupv-side { position: absolute; grid-column: 1; grid-row: 2; top: 0; right: 0; bottom: 0; width: var(--side-w);
  transform: translateX(100%); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), visibility 0s linear var(--dur); }
.mupv-app.is-stage .mupv-tlwrap { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(28px); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform var(--dur) var(--ease), opacity calc(var(--dur) * .7) var(--ease), visibility 0s linear var(--dur); }
.mupv-app.is-stage .mupv-mini { opacity: 1; visibility: visible; transition: opacity var(--dur) var(--ease) 60ms, visibility 0s; }

@media (min-width: 1360px) {
  .mupv-scene { grid-template-columns: 112px minmax(0, 1fr); }
  .mupv-sth { width: 112px; }
}
@container (max-width: 800px) {
  .mupv-now { display: none; }
  .mupv-transport .mupv-tgroup:last-child { margin-left: auto; }
}
@media (max-width: 1200px) {
  .mupv-scene { grid-template-columns: 84px minmax(0, 1fr); gap: 10px; }

}
@media (max-width: 860px) {
  .mupv-app { display: block; overflow: auto; }
  .mupv-top { position: sticky; top: 0; z-index: 5; background: var(--mu-bg); padding: 8px 16px; flex-wrap: wrap; }
  .mupv-badge { order: 3; width: 100%; }
  .mupv-view { flex: none; height: 56vw; min-height: 180px; margin: 14px 16px 0; }
  .mupv-transport { padding-left: 16px; padding-right: 16px; }
  .mupv-tlwrap { padding: 0 16px 14px; }
  .mupv-keys { display: none; }
  .mupv-side { border-left: 0; border-top: 1px solid var(--mu-line); }
  .mupv-panel, .mupv-dbody { overflow: visible; }
  .mupv-side { overflow: visible; }
  .mupv-track { width: 100%; height: auto; transform: none !important; }
  .mupv-track > * { width: 100%; height: auto; }
  .mupv-side.is-deliver .mupv-insp, .mupv-side:not(.is-deliver) .mupv-deliver { display: none; }
  .mupv-app.is-stage .mupv-side, .mupv-app.is-stage .mupv-tlwrap { display: none; }
  .mupv-xbtn span, .mupv-show span { display: none; }
  .mupv-mini { left: 16px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .mupv-app *, .mupv-app *::before, .mupv-app *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation-duration: 0s !important; }
}
/* edits: the Elements tab, the editable Design tab, the stage selection (the Video Editor's violet), the list of changes,
   the colour popover — fields follow the HTML editor's inspector: small boxed controls, neutral focus, a grip to scrub */
.mupv-app { --mupe-sel: #A78BFA; --mupe-sel-strong: #7761F0; }

/* top bar */
.mupe-chgwrap { position: relative; flex: none; }
.mupv-app .mupe-chg { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 10px; border: 1px solid var(--mu-line); border-radius: 13px; background: transparent; color: var(--mu-sub); font-size: 12px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mupv-app .mupe-chg:hover { color: var(--mu-txt); border-color: var(--mu-sub); }
.mupe-chg i { width: 6px; height: 6px; border-radius: 50%; background: var(--mu-line); }
.mupv-app .mupe-chg.has { color: var(--mu-txt); }
.mupe-chg.has i { background: var(--mu-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mu-good) 20%, transparent); }
.mupe-chgpop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column; max-height: min(70vh, 560px);
  background: var(--mu-panel); border: 1px solid var(--mu-line); border-radius: 12px; box-shadow: 0 24px 60px -16px rgba(0,0,0,.6); overflow: hidden; }
.mupe-chghead { display: flex; align-items: center; gap: 4px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--mu-line); }
.mupe-chghead b { margin-right: auto; font-weight: 600; font-size: 13px; }
.mupe-chglist { flex: 1; min-height: 0; overflow: auto; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--mu-line) transparent; }
.mupe-crow { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 7px 4px 7px 8px; border-radius: 8px; }
.mupe-crow:hover { background: var(--mu-soft); }
.mupe-cscope { grid-row: 1 / 3; font-size: 11px; color: var(--mu-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mupe-crow b { font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mupe-cval { grid-column: 2; display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; color: var(--mu-txt); white-space: nowrap; overflow: hidden; }
.mupe-cval > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mupe-cval svg { width: 11px; height: 11px; color: var(--mu-sub); }
.mupe-cval i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.mupe-was { color: var(--mu-sub); }
.mupe-none { color: var(--mu-sub); font-style: italic; }
.mupe-crow .mupe-ibtn { grid-column: 3; grid-row: 1 / 3; opacity: .55; }
.mupe-crow:hover .mupe-ibtn, .mupe-crow .mupe-ibtn:focus-visible { opacity: 1; }
.mupe-nochg { padding: 14px 10px; }
.mupe-chgfoot { display: flex; align-items: center; gap: 6px; padding: 10px; border-top: 1px solid var(--mu-line); }
.mupe-chgfoot > span { margin-right: auto; font-size: 11.5px; color: var(--mu-sub); }

/* small buttons */
.mupv-app .mupe-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--mu-line); border-radius: 7px; background: var(--mu-soft); color: var(--mu-txt); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.mupv-app .mupe-btn:hover { border-color: var(--mu-sub); }
.mupv-app .mupe-btn:disabled { opacity: .45; cursor: default; border-color: var(--mu-line); }
.mupv-app .mupe-btn svg { width: 14px; height: 14px; }
.mupv-app .mupe-btn.is-strong { background: var(--mu-acc); color: var(--mu-on-acc); border-color: transparent; font-weight: 600; }
.mupv-app .mupe-btn.is-strong:hover { filter: brightness(1.06); }
.mupv-app .mupe-ibtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: none; border: 0; border-radius: 7px; background: transparent; color: var(--mu-sub); cursor: pointer; padding: 0; }
.mupv-app .mupe-ibtn svg { width: 15px; height: 15px; }
.mupv-app .mupe-ibtn:hover { color: var(--mu-txt); background: var(--mu-soft); }
.mupv-app .mupe-ibtn:disabled { opacity: .35; cursor: default; background: transparent; }

/* stage: hover, selection (the Video Editor's violet), the name tag */
.mupv-view { -webkit-user-select: none; user-select: none; }
.mupv-frame { cursor: default; }
.mupv-frame.is-moving { cursor: grabbing; }
.mupe-ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.mupe-box { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 2px; }
.mupe-box.is-hover { box-shadow: 0 0 0 1.5px var(--mupe-sel); }
.mupe-box.is-sel { box-shadow: 0 0 0 2px var(--mupe-sel), 0 0 0 3px rgba(0,0,0,.18); }
.mupe-box.is-sel i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1.5px solid var(--mupe-sel-strong); border-radius: 1.5px; }
.mupe-box.is-sel i:nth-child(1) { left: -4.5px; top: -4.5px; } .mupe-box.is-sel i:nth-child(2) { right: -4.5px; top: -4.5px; }
.mupe-box.is-sel i:nth-child(3) { left: -4.5px; bottom: -4.5px; } .mupe-box.is-sel i:nth-child(4) { right: -4.5px; bottom: -4.5px; }
.mupe-tag { position: absolute; left: 0; top: 0; max-width: 60%; padding: 2px 7px; border-radius: 4px; background: color-mix(in srgb, var(--mupe-sel-strong) 88%, transparent); color: #fff; font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mupe-tag.is-sel { background: var(--mupe-sel-strong); }

/* Elements tab */
.mupv-tab svg + span + small:empty { display: none; }
.mupe-sec { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.mupe-sec + .mupe-sec { border-top: 1px solid var(--mu-line); }
.mupe-sec > .mupv-h { padding: 0 4px; }
.mupe-sub { margin: -4px 0 2px; padding: 0 4px; font-size: 12px; color: var(--mu-sub); line-height: 1.45; }
.mupv-dsec .mupe-sub { margin: -6px 0 0; padding: 0; }
.mupe-hint { display: flex; gap: 10px; align-items: flex-start; margin: 4px 16px 6px; padding: 11px 12px; border: 1px dashed var(--mu-line); border-radius: 9px; color: var(--mu-sub); font-size: 12.5px; line-height: 1.5; }
.mupe-hint svg { width: 16px; height: 16px; margin-top: 1px; color: var(--mupe-sel); }
.mupe-empty { padding: 4px 16px 16px; }
.mupe-card { border: 1px solid var(--mu-line); border-radius: 10px; background: color-mix(in srgb, var(--mu-soft) 38%, transparent); transition: border-color .15s; }
.mupe-card:hover { border-color: color-mix(in srgb, var(--mupe-sel) 55%, var(--mu-line)); }
.mupe-card.is-scene:hover { border-color: var(--mu-line); }
.mupe-chead { display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 5px 6px 3px 9px; }
.mupe-chead b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mupe-chead small { margin-left: auto; font-size: 11px; color: var(--mu-sub); white-space: nowrap; }
.mupe-chead .mupe-loc { margin-left: auto; opacity: 0; transition: opacity .15s; }
.mupe-card:hover .mupe-loc, .mupe-loc:focus-visible { opacity: 1; }
.mupe-glyph { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: var(--mu-soft); color: var(--mu-sub); }
.mupe-glyph svg { width: 13px; height: 13px; }
.mupe-glyph.is-sel { background: color-mix(in srgb, var(--mupe-sel) 22%, transparent); color: var(--mupe-sel); }
.mupe-rows { display: flex; flex-direction: column; gap: 4px; }
.mupe-card .mupe-rows { padding: 2px 9px 9px; }

/* the selected element */
.mupe-selsec { gap: 10px; }
.mupe-selhead { display: flex; align-items: center; gap: 10px; padding: 0 0 0 4px; }
.mupe-selhead .mupe-glyph { width: 28px; height: 28px; border-radius: 7px; }
.mupe-selhead .mupe-glyph svg { width: 15px; height: 15px; }
.mupe-selhead div { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.mupe-selhead b { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mupe-selhead small { font-size: 11.5px; color: var(--mu-sub); }
.mupe-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 3px; padding: 0 4px; font-size: 11.5px; color: var(--mu-sub); }
.mupe-crumbs svg { width: 10px; height: 10px; opacity: .6; }
.mupv-app .mupe-crumbs button { border: 0; background: transparent; padding: 1px 4px; margin: 0 -2px; border-radius: 4px; color: var(--mu-sub); cursor: pointer; font-size: 11.5px; }
.mupv-app .mupe-crumbs button:hover { color: var(--mu-txt); background: var(--mu-soft); }
.mupe-crumbs span { color: var(--mu-txt); }
.mupe-off { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 8px 8px 12px; border-radius: 9px; background: color-mix(in srgb, var(--mu-warn) 9%, transparent); border: 1px solid color-mix(in srgb, var(--mu-warn) 35%, var(--mu-line)); font-size: 12px; color: var(--mu-txt); }
.mupe-card.is-own { border-color: color-mix(in srgb, var(--mupe-sel) 45%, var(--mu-line)); }
.mupe-more { border-top: 1px solid var(--mu-line); padding-top: 4px; }
.mupe-more summary { display: flex; align-items: center; gap: 6px; list-style: none; padding: 6px 4px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--mu-sub); border-radius: 6px; }
.mupe-more summary::-webkit-details-marker { display: none; }
.mupe-more summary:hover { color: var(--mu-txt); }
.mupe-more summary svg { width: 12px; height: 12px; transition: transform .15s; }
.mupe-more[open] summary svg { transform: rotate(90deg); }
.mupe-more summary small { font-size: 11px; font-variant-numeric: tabular-nums; }
.mupe-more .mupe-rows { padding: 2px 0 2px; }
.mupe-selsec > .mupe-rows { padding: 0 2px; }

/* a field row: label (reset dot) · control */
.mupe-row { display: grid; grid-template-columns: minmax(78px, 34%) minmax(0, 1fr); align-items: center; gap: 10px; min-height: 30px; }

const design = $('mupv-p-design');
function swatch(b, label, sub) {
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'mupv-sw mupe-sw';
  btn.innerHTML = `<i class="mupv-chipc"></i><b>${esc(label)}</b><span></span><em class="mupe-dot" role="button" title="Back to the agent’s value" aria-label="Reset ${esc(label)}" hidden></em>`;
  const dot = btn.querySelector('.mupe-dot');
  const update = () => {
    const v = b.get();
    btn.querySelector('i').style.setProperty('--c', cssOf(v));
    btn.querySelector('span').textContent = sub(v);
    const ch = b.changed(); dot.hidden = !ch; btn.classList.toggle('is-changed', ch);
    btn.title = ch ? `${label}: was ${hexOf(b.orig())}` : `${label}: click to change`;
  };
  btn.onclick = (e) => {
    if (e.target === dot) { b.reset(); apply(b.kind); commit(); update(); return; }
    picker.open(btn, { value: b.get(), tokens: false, onInput: (v) => { b.set(v); apply(b.kind); update(); }, onDone: commit });
  };
  update();
  const f = { el: btn, update }; fields.add(f); return f;
}
const hexSub = (v) => hexOf(v) + (alphaOf(v) < 0.995 ? ` · ${Math.round(alphaOf(v) * 100)}%` : '');
function renderDesign() {
  const P = palette();
  fields.forEach((f) => { if (design.contains(f.el)) fields.delete(f); });
  design.innerHTML = `<div class="mupv-dsec"><h2 class="mupv-h">Film</h2><div class="mupe-rows" id="mupe-film"></div><div class="mupv-keycols" id="mupe-key"></div></div>
    <div class="mupv-dsec"><h2 class="mupv-h">Colours <span>the film’s</span></h2>
      <p class="mupe-sub">Change one and everything that uses it follows.</p>
      <div class="mupv-keycols" id="mupe-named"></div>
      <h3 class="mupe-h3"${P.literals.length ? '' : ' hidden'}>Library colours <span>set in the library scenes</span></h3><div class="mupv-keycols" id="mupe-lits"></div></div>
    <div class="mupv-dsec"><h2 class="mupv-h">Type</h2><div class="mupe-rows" id="mupe-fontrow"></div><p class="mupe-sub" id="mupe-fontnote" hidden></p><div id="mupe-spec"></div></div>`;
  $('mupe-film').appendChild(row(filmBinding('theme', 'theme'), { kind: 'seg', label: 'Theme', options: [['light', 'Light'], ['dark', 'Dark']] }).el);
  if (BASE.background) $('mupe-key').appendChild(swatch(filmBinding('background', 'bg'), 'Background', hexSub).el);
  $('mupe-key').appendChild(swatch(filmBinding('accent', 'theme'), 'Accent', hexSub).el);
  for (const t of P.tokens) if (t.name !== 'acc' && t.name !== 'bg') $('mupe-named').appendChild(swatch(tokenBinding(t.name), ROLE[t.name] || t.name, (v) => `${t.name} · ${hexOf(v)}`).el);
  for (const n of P.custom) $('mupe-named').appendChild(swatch(tokenBinding(n), pretty(n) || n, (v) => `${n} · ${hexOf(v)}`).el);
  for (const l of P.literals) $('mupe-lits').appendChild(swatch(recolorBinding(l.value), hexOf(l.value), (v) => (sameColor(v, l.value) ? `${l.uses} use${l.uses > 1 ? 's' : ''}` : `now ${hexSub(v)}`)).el);
  $('mupe-fontrow').appendChild(row(filmBinding('font', 'theme'), { kind: 'select', label: 'Font', options: Object.keys(K.FONTS).map((n) => [n, n]) }).el);
  renderSpecimen();
}
function renderSpecimen() {
  const P = palette(), name = sc.font || K.FONT_DEFAULT, f = K.fontOf(name);
  if (sc.font) K.useFont(sc.font);
  const WN = { 100: 'Thin', 200: 'Extra light', 300: 'Light', 400: 'Regular', 500: 'Medium', 600: 'Semibold', 700: 'Bold', 800: 'Heavy', 900: 'Black' };
  const range = (a) => (a.length > 1 ? `${a[0]}–${a[a.length - 1]} px · ${a.length} sizes` : `${a[0]} px`);
  $('mupe-spec').innerHTML = `<div class="mupv-font"><header><q style="font-family:${esc(f.stack)}">Aa</q><div><b>${esc(name)}</b><span>${esc(capw(f.note || 'Google Fonts'))}</span></div></header>`
    + P.type.map((s) => `<div class="mupv-style" title="${esc(s.sizes.join(', '))} px"><em>${WN[s.weight] || s.weight} ${s.weight}</em><small>${range(s.sizes)}</small><q style="font-weight:${s.weight};font-family:${esc(f.stack)}">${esc(s.sample || 'Aa 0123')}</q></div>`).join('') + '</div>';
  const note = $('mupe-fontnote');
  note.hidden = (sc.font || K.FONT_DEFAULT) === (BASE.font || K.FONT_DEFAULT);
  note.textContent = 'Every scene gets this font through --gl-font; words that were fitted to the old one may need the agent to re-fit them before it renders.';
}

// ── the top bar: the list of changes ──
const chgWrap = div('mupe-chgwrap', `<button type="button" class="mupe-chg" id="mupe-chg" aria-expanded="false" aria-controls="mupe-chgpop"><i></i><span></span></button>
  <div class="mupe-chgpop" id="mupe-chgpop" role="dialog" aria-label="Your changes" hidden>
    <div class="mupe-chghead"><b>Your changes</b><button type="button" class="mupe-ibtn" id="mupe-undo" title="Undo (⌘Z)" aria-label="Undo">${IC.undo}</button><button type="button" class="mupe-ibtn" id="mupe-redo" title="Redo (⇧⌘Z)" aria-label="Redo">${IC.redo}</button></div>
    <div class="mupe-chglist" id="mupe-chglist"></div>
    <div class="mupe-chgfoot"><span id="mupe-saved"></span><button type="button" class="mupe-btn" id="mupe-reset">Reset all</button><button type="button" class="mupe-btn is-strong" id="mupe-copy">${IC.copy}<span>Copy for the agent</span></button></div>
  </div>`);
$('mupv-mode').after(chgWrap);
const chgBtn = $('mupe-chg'), chgPop = $('mupe-chgpop'), chgList = $('mupe-chglist');
const agentLine = $('mupv-agentline');
const leafCount = () => {
  let n = 0; const f = EDITS.film;
  for (const k of ['theme', 'accent', 'background', 'font']) if (has(f, k)) n++;
  n += Object.keys(f.colors || {}).length + Object.keys(f.recolor || {}).length;
  for (const s of Object.values(EDITS.scenes)) {
    n += Object.keys(s.text || {}).length + Object.keys(s.images || {}).length + Object.keys(s.params || {}).length;
    for (const st of Object.values(s.style || {})) for (const v of Object.values(st)) n += v && typeof v === 'object' ? Object.keys(v).length : 1;
  }
  return n;
};
function updateBadge() {
  const n = leafCount();
  chgBtn.classList.toggle('has', n > 0);
  chgBtn.querySelector('span').textContent = n ? `${n} change${n > 1 ? 's' : ''}` : 'No changes';
  $('mupe-undo').disabled = hpos <= 0; $('mupe-redo').disabled = hpos >= hist.length - 1;
  if (agentLine) agentLine.textContent = n ? `Your ${n} change${n > 1 ? 's are' : ' is'} saved. Approve it in the chat, and the agent renders with ${n > 1 ? 'them' : 'it'}`
    : AGENT_LINE;
}

// every edit as a row a person reads: where · what · before → now · revert
const labelFor = (i, key, prop) => {
  for (const c of CARDS.filter((x) => x.scene === i)) for (const x of c.controls) {
    if (x.param) continue;
    if (String(x.layer || c.anchor) === key && (ALIAS[x.prop] || x.prop) === prop) return x.label || c.label;
  }
  const P = PROPS[prop];
  return `${nameOf(i, key)} · ${P ? P.label.toLowerCase() : prop}`;
};
const valHtml = (prop, v) => {
  if (v == null || v === '') return '<span class="mupe-none">none</span>';
  if (['fill', 'stroke', 'color', 'colors', 'accent', 'background', 'recolor'].includes(prop) || (typeof v === 'string' && (/^#[0-9a-f]{3,8}$/i.test(v) || tokenOf(v)))) return `<i class="mupv-chipc" style="--c:${esc(cssOf(v))}"></i>${esc(colorName(v))}`;
  if (prop === 'image') return 'a new picture';
  if (prop === 'hide') return v ? 'Hidden' : 'Shown';
  if (typeof v === 'boolean') return v ? 'On' : 'Off';
  if (prop === 'upper') return v ? 'UPPER' : 'As typed';
  if (prop === 'text') return `“${esc(trunc(v, 26))}”`;
  if (prop === 'ls') return `${+(v * 100).toFixed(1)}%`;
  if (prop === 'scale') return `${Math.round(v * 100)}%`;
  if (prop === 'x' || prop === 'y' || prop === 'size' || prop === 'r') return `${+(+v).toFixed(1)} px`;
  if (prop === 'rotate') return `${+(+v).toFixed(1)}°`;
  if (typeof v === 'number') return String(+v.toFixed(3));
  return esc(capw(v));
};
function changeRows() {
  const f = EDITS.film, rows = [];
  const add = (scope, label, prop, from, to, revert) => rows.push({ scope, label, prop, from, to, revert });
  if (has(f, 'theme')) add('Film', 'Theme', 'theme', FILM_BASE.theme(), f.theme, () => { delete f.theme; });
  if (has(f, 'background')) add('Film', 'Background', 'background', FILM_BASE.background(), f.background, () => { delete f.background; });
  if (has(f, 'accent')) add('Film', 'Accent', 'accent', FILM_BASE.accent(), f.accent, () => { delete f.accent; });
  for (const [n, v] of Object.entries(f.colors || {})) add('Film', ROLE[n] || n, 'colors', tokenBase(n), v, () => { delete f.colors[n]; });
  for (const [h, v] of Object.entries(f.recolor || {})) add('Film', 'Library colour', 'recolor', recolorBase(h), v, () => { delete f.recolor[h]; });
  if (has(f, 'font')) add('Film', 'Font', 'font', FILM_BASE.font(), f.font, () => { delete f.font; });
  for (const [sn, s] of Object.entries(EDITS.scenes).sort((a, b) => a[0] - b[0])) {
    const i = +sn - 1, scope = `Scene ${sn}`;
    if (!BASE.scenes[i]) continue;
    for (const [k, v] of Object.entries(s.text || {})) add(scope, labelFor(i, k, 'text'), 'text', elementBinding(i, k, 'text').orig(), v, () => { delete s.text[k]; });
    for (const [k, v] of Object.entries(s.images || {})) add(scope, labelFor(i, k, 'image'), 'image', null, v, () => { delete s.images[k]; });
    for (const [k, st] of Object.entries(s.style || {})) for (const [p, v] of Object.entries(st)) add(scope, labelFor(i, k, p), p, elementBinding(i, k, p).orig(), v, () => { delete st[p]; });
    for (const [n, v] of Object.entries(s.params || {})) add(scope, (paramDefs(i)[n] || {}).label || pretty(n), 'param', paramsBase(i)[n], v, () => { delete s.params[n]; });
  }
  return rows;
}
let rowsNow = [];
function renderChanges() {
  updateBadge();
  if (chgPop.hidden) return;
  rowsNow = changeRows();
  chgList.innerHTML = rowsNow.length ? rowsNow.map((r, j) => `<div class="mupe-crow"><span class="mupe-cscope">${esc(r.scope)}</span><b title="${esc(r.label)}">${esc(r.label)}</b>`
    + `<span class="mupe-cval">${r.prop === 'image' ? '' : `<span class="mupe-was">${valHtml(r.prop, r.from)}</span>${IC.chev}`}<span>${valHtml(r.prop, r.to)}</span></span>`
    + `<button type="button" class="mupe-ibtn" data-j="${j}" title="Revert" aria-label="Revert ${esc(r.label)}">${IC.revert}</button></div>`).join('')
    : '<p class="mupv-note mupe-nochg">Nothing changed yet. Change a colour on the Design tab, or click anything in the film.</p>';
  $('mupe-saved').textContent = saveNote || (rowsNow.length ? `Saved to ${SAVE_WHERE}` : '');
  $('mupe-reset').disabled = !rowsNow.length; $('mupe-copy').disabled = !rowsNow.length;
}
chgList.onclick = (e) => {
  const b = e.target.closest('button[data-j]'); if (!b) return;
  rowsNow[+b.dataset.j].revert(); prune(); applyAll(); commit();
};
let resetArm = false;
const closeChanges = () => { chgPop.hidden = true; chgBtn.setAttribute('aria-expanded', 'false'); resetArm = false; $('mupe-reset').textContent = 'Reset all'; };
chgBtn.onclick = () => { if (chgPop.hidden) { chgPop.hidden = false; chgBtn.setAttribute('aria-expanded', 'true'); renderChanges(); } else closeChanges(); };
addEventListener('pointerdown', (e) => { if (!chgPop.hidden && !chgWrap.contains(e.target)) closeChanges(); }, true);
$('mupe-undo').onclick = () => travel(-1);
$('mupe-redo').onclick = () => travel(1);
$('mupe-reset').onclick = (e) => {
  if (!resetArm) { resetArm = true; e.currentTarget.textContent = 'Reset every change?'; return; }
  resetArm = false; e.currentTarget.textContent = 'Reset all';
  setEdits(null); applyAll(); commit();
};
// what the agent gets: the edits for scenario.json (a picture chosen here is named, not inlined)
const forAgent = () => {
  const out = editsOut() || { film: {}, scenes: {} };
  for (const s of Object.values(out.scenes)) if (s.images) for (const k of Object.keys(s.images)) if (/^data:/.test(s.images[k])) s.images[k] = '(a picture I chose in the preview: ask me for the file)';
  return `My changes in the preview of “${BASE.name}” — put them in scenario.json as "edits" (node tools/edits.mjs lists them):\n`
    + JSON.stringify({ edits: out }, null, 2);
};
$('mupe-copy').onclick = (e) => {
  const sp = e.currentTarget.querySelector('span');
  const done = (ok) => { sp.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { sp.textContent = 'Copy for the agent'; }, 1400); };
  try { navigator.clipboard.writeText(forAgent()).then(() => done(true), () => done(false)); } catch (err) { done(false); }
};

// ── keys: Esc closes / deselects; ⌘Z / ⇧⌘Z undo and redo ──
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (picker.isOpen) { e.preventDefault(); e.stopImmediatePropagation(); picker.close(false); return; }
    if (!chgPop.hidden) { e.preventDefault(); e.stopImmediatePropagation(); closeChanges(); chgBtn.focus(); return; }
    if (sel && !(e.target.closest && e.target.closest('input, textarea, select'))) { e.preventDefault(); e.stopImmediatePropagation(); select(null); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.code === 'KeyZ' && !(e.target.closest && e.target.closest('input, textarea'))) { e.preventDefault(); travel(e.shiftKey ? 1 : -1); }
}, true);

// ── start: the page's edits; a board card reads the ones saved on it (the page itself never changes) ──
index(); renderDesign(); updateBadge();
player.ready.then(() => { index(); lastSig = null; redraw(); });
if (SAVE_WHERE === 'the film on the board') {
  api('GET', `/api/moodboards/${encodeURIComponent(MODE.boardId)}/elements/${encodeURIComponent(MODE.cardId)}`).then((el) => {
    const saved = el && el.data && el.data.muEdits && el.data.muEdits.edits;
    if (saved && JSON.stringify(saved) !== JSON.stringify(editsOut())) { setEdits(saved); hist = [JSON.stringify(EDITS)]; hpos = 0; applyAll(); lastSig = null; }
  }).catch(() => { /* offline: the page's own edits */ });
}
const editLoop = () => { renderElements(); drawOverlay(); requestAnimationFrame(editLoop); };
requestAnimationFrame(editLoop);

// ── clock ──
const tick = (now) => {
  if (playing) {
    if (last != null) {
      cur += ((now - last) / 1000) * rate;
      if (cur >= T) { if (loop) { cur = 0; syncAudio(true); } else { cur = T; setPlaying(false); } }
    }
    last = now; syncAudio(false);
  }
  draw();
  requestAnimationFrame(tick);
};
const q = new URLSearchParams(location.search);
if (q.has('t')) cur = Math.max(0, Math.min(T, +q.get('t') || 0));
drawRuler();
draw();
requestAnimationFrame(tick);
// thumbnails: one scene per idle slice, after the film's pages are up
const idle = window.requestIdleCallback ? (f) => requestIdleCallback(f, { timeout: 200 }) : (f) => setTimeout(f, 16);
let nextThumb = 0;
const buildNext = () => { if (nextThumb >= timing.length) return; buildThumb(nextThumb++); idle(buildNext); };
player.ready.then(() => idle(buildNext));
let remembered = false;
try { remembered = sessionStorage.getItem(STAGE_KEY) === '1'; } catch (e) { /* no storage */ }
if (remembered) { app.classList.add('is-instant'); setStage(true, false); requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('is-instant'))); }
window.__mu = { seek, T, get t() { return cur; }, player, get playing() { return playing; }, setPlaying,
  get sc() { return sc; }, get edits() { return editsOut(); }, flushSave };
window.__muEdit = { select, get sel() { return sel; }, cards: () => CARDS, visibleCards: () => CARDS.filter((c) => sceneOn(c.scene, cur) && rectOf(c.scene, c.anchor)),
  rectOf, infoOf, hitAt, typeIn, travel, forAgent, changeRows, set: (e) => { setEdits(e); applyAll(); commit(); } };
window.__muReady = true;
})();
</script>
