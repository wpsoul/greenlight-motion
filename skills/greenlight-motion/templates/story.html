<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--MU:HEAD-->
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="mu-tokens">@@TOKENS@@</style>
<style>
/* the film's scenario, in words: the story before any item or layout (scenario.json → story). Every colour is a token.
   Laid out for a 1200 px card on the board: big enough to be read from the pipeline, beats as cards in a grid. */
.musc-app { box-sizing: border-box; position: fixed; inset: 0; overflow: auto; background: var(--mu-bg); color: var(--mu-txt);
  font: 16px/1.5 Inter, 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  padding: 40px max(16px, 4.5%) 44px; display: flex; flex-direction: column; gap: 30px; }
.musc-app *, .musc-app *::before, .musc-app *::after { box-sizing: border-box; }
.musc-app [hidden] { display: none !important; }
.musc-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--mu-sub); }
.musc-app h1 { margin: 8px 0 0; font-size: 40px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.musc-logline { margin: 14px 0 0; font-size: 23px; line-height: 1.42; max-width: 62ch; text-wrap: pretty; }
.musc-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.musc-fact { border: 1px solid var(--mu-line); border-radius: 8px; padding: 5px 11px; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.musc-fact b { font-weight: 600; margin-right: 5px; }
.musc-fact span { color: var(--mu-sub); }
/* what to do with it: read it first, approve it or ask for changes */
.musc-call { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--mu-line); border-left: 3px solid var(--mu-acc); border-radius: 10px; padding: 14px 18px; background: var(--mu-panel); }
.musc-call b { display: block; font-size: 16px; font-weight: 600; }
.musc-call p { margin: 2px 0 0; color: var(--mu-sub); font-size: 15px; text-wrap: pretty; }
.musc-acts { display: flex; flex-direction: column; gap: 30px; }
.musc-act h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--mu-sub); }
.musc-beats { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.musc-beat { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--mu-line); border-radius: 12px; padding: 16px 18px 18px; background: var(--mu-panel); min-width: 0; }
.musc-n { width: 26px; height: 26px; border-radius: 13px; background: var(--mu-soft); color: var(--mu-txt); font-size: 13px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.musc-beat b { font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.musc-beat p { margin: 0; color: var(--mu-sub); font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
/* a brand-new film's art direction (scenario.json → direction): the concept approved with the story */
.musc-dir h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--mu-sub); }
.musc-dirbox { border: 1px solid var(--mu-line); border-radius: 12px; padding: 20px 22px; background: var(--mu-panel); display: flex; flex-direction: column; gap: 20px; }
.musc-idea { margin: 0; font-size: 20px; line-height: 1.45; font-weight: 500; text-wrap: pretty; }
.musc-dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px 24px; margin: 0; font-size: 15px; }
.musc-dl dt { color: var(--mu-sub); }
.musc-dl dd { margin: 0; overflow-wrap: anywhere; }
.musc-sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--mu-line); vertical-align: -3px; margin-right: 4px; }
</style>
<!--/MU:HEAD-->
</head>
<body>
<!--MU:BODY-->
<div class="musc-app" id="musc">
  <header>
    <div class="musc-eyebrow">GL Motion · scenario</div>
    <h1 id="musc-name"></h1>
    <p class="musc-logline" id="musc-logline"></p>
    <div class="musc-facts" id="musc-facts"></div>
  </header>
  <div class="musc-call" role="note"><div><b id="musc-calltitle">Read the story first.</b><p id="musc-foot"></p></div></div>
  <div class="musc-acts" id="musc-acts"></div>
  <section class="musc-dir" id="musc-dir" hidden><h3>Direction</h3><div class="musc-dirbox"><p class="musc-idea" id="musc-idea"></p><dl class="musc-dl" id="musc-dl"></dl></div></section>
</div>
@@SCRIPTS@@
<script>
(function () {
'use strict';
const D = @@DATA@@;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; };
$('musc-name').textContent = D.name;
$('musc-logline').textContent = D.logline || '';
$('musc-facts').innerHTML = D.facts.map(([a, b]) => `<div class="musc-fact"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');
let n = 0;
$('musc-acts').innerHTML = D.acts.map((a) => `<section class="musc-act">${a.title ? `<h3>${esc(a.title)}</h3>` : ''}<div class="musc-beats">${a.beats.map((b) => `<article class="musc-beat"><span class="musc-n">${++n}</span><b>${esc(b.title)}</b>${b.idea ? `<p>${esc(b.idea)}</p>` : ''}</article>`).join('')}</div></section>`).join('');
$('musc-foot').textContent = D.foot;
if (D.direction) {
  const d = D.direction; const sw = (D.swatches || []).map((c) => `<i class="musc-sw" style="background:${esc(c)}" title="${esc(c)}"></i>`).join('');
  $('musc-idea').textContent = d.idea || '';
  $('musc-dl').innerHTML = [['Look', d.look, sw], ['Type', d.type], ['Motion', d.motion], ['Signature', d.signature], ['References', Array.isArray(d.references) ? d.references.join(' · ') : d.references]]
    .filter(([, v, s]) => v || s).map(([k, v, s]) => `<dt>${k}</dt><dd>${s || ''}${esc(v || '')}</dd>`).join('');
  $('musc-dir').hidden = false;
}
if (D.call) $('musc-calltitle').textContent = D.call;
document.title = `${D.name} — scenario`;
window.__muReady = true;
})();
</script>
<!--/MU:BODY-->
</body>
</html>
