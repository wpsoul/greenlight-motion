<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--MU:HEAD-->
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="mu-tokens">@@TOKENS@@</style>
<style>
/* the film's script: the scenario as a document (the scenario card beside it plays it). Every colour is a token. */
.musc-app { box-sizing: border-box; position: fixed; inset: 0; overflow: auto; background: var(--mu-bg); color: var(--mu-txt);
  font: 14px/1.5 Inter, 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  padding: 26px max(16px, 5%) 40px; display: flex; flex-direction: column; gap: 22px; }
.musc-app *, .musc-app *::before, .musc-app *::after { box-sizing: border-box; }
.musc-app [hidden] { display: none !important; }
.musc-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--mu-sub); }
.musc-app h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.musc-brief { margin: 8px 0 0; color: var(--mu-sub); text-wrap: pretty; }
.musc-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.musc-fact { border: 1px solid var(--mu-line); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.musc-fact b { font-weight: 600; margin-right: 4px; }
.musc-fact span { color: var(--mu-sub); }
.musc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
/* scenes */
.musc-scenes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--mu-line); }
.musc-scene { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 14px; padding: 16px 0 18px; border-bottom: 1px solid var(--mu-line); }
.musc-n { width: 24px; height: 24px; border-radius: 12px; background: var(--mu-soft); color: var(--mu-txt); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; margin-top: 1px; }
.musc-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.musc-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.musc-top h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; flex: 1 1 auto; min-width: 0; }
.musc-time { color: var(--mu-sub); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.musc-item { color: var(--mu-sub); font-size: 12.5px; margin-top: -4px; }
.musc-tr { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--mu-line); border-radius: 5px; font-size: 11px; line-height: 18px; color: var(--mu-sub); vertical-align: 1px; }
.musc-copy { display: grid; grid-template-columns: minmax(64px, max-content) minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; }
.musc-copy dt { color: var(--mu-sub); }
.musc-copy dd { margin: 0; overflow-wrap: anywhere; }
.musc-copy q { quotes: '“' '”'; }
.musc-vo { border-left: 2px solid var(--mu-acc); padding-left: 10px; font-size: 13px; }
.musc-vo span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mu-sub); margin-bottom: 1px; }
.musc-foot { color: var(--mu-sub); font-size: 12.5px; }
</style>
<!--/MU:HEAD-->
</head>
<body>
<!--MU:BODY-->
<div class="musc-app" id="musc">
  <header>
    <div class="musc-eyebrow">GL Motion · script</div>
    <h1 id="musc-name"></h1>
    <p class="musc-brief" id="musc-brief" hidden></p>
    <div class="musc-facts" id="musc-facts"></div>
  </header>
  <ol class="musc-scenes" id="musc-scenes"></ol>
  <p class="musc-foot" id="musc-foot"></p>
</div>
@@SCRIPTS@@
<script>
(function () {
'use strict';
const D = @@DATA@@;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; };
$('musc-name').textContent = D.name;
if (D.brief) { $('musc-brief').textContent = D.brief; $('musc-brief').hidden = false; }
$('musc-facts').innerHTML = [
  [`${D.w}×${D.h}`, D.w >= D.h ? 'landscape' : 'vertical'], [D.fps, 'fps'], [D.T.toFixed(1) + ' s', `${Math.round(D.T * D.fps)} frames`],
  [D.scenes.length, D.scenes.length === 1 ? 'scene' : 'scenes'], [D.theme === 'dark' ? 'Dark' : 'Light', 'theme'],
].map(([a, b]) => `<div class="musc-fact"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')
  + (D.accent ? `<div class="musc-fact"><i class="musc-dot" style="background:${esc(D.accent)}"></i><span>accent ${esc(D.accent)}</span></div>` : '');
$('musc-scenes').innerHTML = D.scenes.map((s) => {
  const copy = s.text.map(([k, v]) => `<dt>${esc(k)}</dt><dd><q>${esc(v)}</q></dd>`).join('');
  const tr = s.n > 1 ? `<span class="musc-tr">${s.transition === 'fade' ? 'fade in' : 'cut'}</span>` : '';
  return `<li class="musc-scene"><span class="musc-n">${s.n}</span><div class="musc-body">
    <div class="musc-top"><h2>${esc(s.title)}</h2><span class="musc-time">${fmt(s.start)} – ${fmt(s.end)}</span></div>
    <div class="musc-item">${esc(s.item)} · ${s.duration.toFixed(2)} s${s.pictures ? ` · ${s.pictures} picture${s.pictures > 1 ? 's' : ''}` : ''}${tr}</div>
    ${copy ? `<dl class="musc-copy">${copy}</dl>` : ''}
    ${s.voice ? `<div class="musc-vo"><span>Voice-over</span>${esc(s.voice)}</div>` : ''}
  </div></li>`;
}).join('');
$('musc-foot').textContent = 'The scenario card beside this one plays every scene. Ask your agent for changes.';
document.title = `${D.name} — script`;
window.__muReady = true;
})();
</script>
<!--/MU:BODY-->
</body>
</html>
